name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  deployments: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"
      - run: make render
      - name: Pack site
        run: |
          mkdir -p .preview/assets
          cp index.html 404.html site.css site.js robots.txt .preview/
          cp -R assets/. .preview/assets/
      - name: Deploy Cloudflare Pages preview
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 5df63797a855bbbf45888e65e49cebe3
          command: pages deploy .preview --project-name=nstranquist-site --branch=${{ github.head_ref }} --commit-dirty=true
      - name: Comment preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.deploy.outputs.command-output }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          url="$(printf '%s\n' "$OUT" | rg -o 'https://[A-Za-z0-9._/-]+\.pages\.dev\S*' | head -n 1 || true)"
          if [ -z "$url" ]; then
            url="${{ steps.deploy.outputs.deployment-url }}"
          fi
          if [ -z "$url" ]; then
            echo "No preview URL in wrangler output"
            exit 1
          fi
          body="Preview: ${url}"
          id="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR}/comments" --jq '.[] | select(.body | startswith("Preview:")) | .id' | tail -n 1 || true)"
          if [ -n "${id:-}" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body"
          else
            gh pr comment "$PR" --body "$body"
          fi
