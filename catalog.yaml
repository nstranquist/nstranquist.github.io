# Public catalog for https://nstranquist.github.io/
# Featured rows are selected work with a GitHub Release.
# also_public holds other public source, including extracts without a tag.
# Keep the story aligned with ~/dev/nstranquist/catalog.yaml.
schema_version: 1
identity:
  name: Nico Stranquist
  role: Senior software engineer
  location: St. Louis
  thesis: Developer tools, native Mac apps, and full-stack products.
  intro: |
    I build developer tools, native Mac apps, and full-stack products.

    This page lists public GitHub work. The first group has tagged releases.
    The second group is also public, including repos that do not have a tag yet.
  github: https://github.com/nstranquist
  linkedin: https://linkedin.com/in/nstranquist
  site: https://nstranquist.github.io
featured:
  - id: product.docs-puller
    name: docs-puller
    repo: nstranquist/docs-puller
    url: https://github.com/nstranquist/docs-puller
    proof_url: https://github.com/nstranquist/docs-puller/releases/tag/v0.7.6
    license: Apache-2.0
    language: Go
    lane: docs search
    proof: v0.7.6
    demo_url: https://docs-puller-demo.nstranquist.workers.dev
    demo_label: Live demo
    summary: Search vendor and project docs on your machine.
    detail: >-
      Copies docs to Markdown, indexes them with SQLite FTS5, and searches them
      locally. A public BM25 sample reaches 95.8% Hit@1 and 100% Hit@5. A live
      demo searches the same sample corpus.
    metric:
      label: public BM25 sample
      value: 95.8% Hit@1 · 100% Hit@5
  - id: product.nicos-catalog
    name: Nicos Catalog
    repo: nstranquist/nicos-catalog
    url: https://github.com/nstranquist/nicos-catalog
    proof_url: https://github.com/nstranquist/nicos-catalog/releases/tag/v0.1.1
    license: Apache-2.0
    language: Go
    lane: software catalog
    proof: v0.1.1
    summary: A local engine for software catalogs.
    detail: >-
      Full-text and relationship search, plugins, and a check when files no
      longer match the catalog. Includes a local Explorer UI. The GitHub
      release is v0.1.1.
  - id: product.openbook
    name: Openbook
    repo: nstranquist/openbook
    url: https://github.com/nstranquist/openbook
    proof_url: https://github.com/nstranquist/openbook/releases/tag/v0.1.0
    license: MIT
    language: TypeScript
    lane: social app
    proof: v0.1.0
    summary: A realtime social app on Convex.
    detail: >-
      Accounts, friends, a feed, comments, notifications, and messages.
      Updates run through Convex queries.
  - id: product.agent-ops
    name: agent-ops
    repo: nstranquist/agent-ops
    url: https://github.com/nstranquist/agent-ops
    proof_url: https://github.com/nstranquist/agent-ops/releases/tag/v0.3.2
    license: MIT
    language: Go
    lane: agent tooling
    proof: v0.3.2
    summary: Local records of what an AI agent did.
    detail: >-
      Records what an agent did, what it saw, and what it was allowed to call.
      Everything stays on your machine.
  - id: product.nicos-hidden-menubar
    name: Nicos Hidden Bar
    repo: nstranquist/nicos-hidden-menubar
    url: https://github.com/nstranquist/nicos-hidden-menubar
    proof_url: https://github.com/nstranquist/nicos-hidden-menubar/releases/tag/v0.2.0
    license: GPL-3.0
    language: Swift
    lane: macOS app
    proof: v0.2.0
    summary: Hide and reveal macOS menu-bar items.
    detail: >-
      Visible, hidden, and always-hidden regions, notch-safe overflow, and a
      searchable reveal panel. No account. No network service.
  - id: product.nicos-slot-dock
    name: Nicos Slot Dock
    repo: nstranquist/nicos-slot-dock
    url: https://github.com/nstranquist/nicos-slot-dock
    proof_url: https://github.com/nstranquist/nicos-slot-dock/releases/tag/v0.3.6
    license: MIT
    language: Swift
    lane: macOS app
    proof: v0.3.6
    summary: A native launcher strip next to the macOS Dock.
    detail: >-
      Custom app, file, and URL slots, optional Dock merge or mirror, running-app
      badges, and a reveal from the screen edge or the menu bar. Public source.
      No signed download yet.
  - id: product.jobkit
    name: JobKit
    repo: nstranquist/jobkit
    url: https://github.com/nstranquist/jobkit
    proof_url: https://github.com/nstranquist/jobkit/releases/tag/v0.9.0
    license: MIT
    language: Go
    lane: job search
    proof: v0.9.0
    summary: An offline job-search and resume CLI.
    detail: >-
      Profiles, eligibility rules, and apply packages you review before sending.
      The public repo uses example data only, not a real resume or job history.
  - id: product.session-pressure
    name: SessionPressure
    repo: nstranquist/session-pressure
    url: https://github.com/nstranquist/session-pressure
    proof_url: https://github.com/nstranquist/session-pressure/releases/tag/v0.1.0
    license: Apache-2.0
    language: Go
    lane: host admission
    proof: v0.1.0
    summary: Host admission for concurrent coding agents on one Mac.
    detail: >-
      Reads CPU, memory, thermal, and disk-write pressure, then admits or
      defers agent work. Public source. No downloadable binary.
  - id: product.keepawake
    name: keepawake
    repo: nstranquist/keepawake
    url: https://github.com/nstranquist/keepawake
    proof_url: https://github.com/nstranquist/keepawake/releases/tag/v0.1.3
    license: MIT
    language: Go
    lane: macOS utility
    proof: v0.1.3
    summary: Keep a closed-lid Mac awake on purpose.
    detail: >-
      Uses pmset and caffeinate so a Mac can keep running with the lid closed.
